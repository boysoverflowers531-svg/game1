<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モグラ叩きゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>モグラ叩き</h1>

    <section class="status" aria-label="ゲーム情報">
      <div class="status-box">
        <span>スコア</span>
        <strong id="score">0</strong>
      </div>
      <div class="status-box">
        <span>残り時間</span>
        <strong><span id="time">30</span>秒</strong>
      </div>
      <div class="status-box">
        <span>最高スコア</span>
        <strong id="highScore">0</strong>
      </div>
    </section>

    <p id="message" class="message">スタートを押してね</p>

    <div class="actions">
      <button id="startButton" class="control-button" type="button">スタート</button>
      <button id="restartButton" class="control-button secondary" type="button" disabled>リスタート</button>
    </div>

    <section id="board" class="board" aria-label="モグラを叩くマス">
      <button class="hole" type="button" aria-label="マス1"></button>
      <button class="hole" type="button" aria-label="マス2"></button>
      <button class="hole" type="button" aria-label="マス3"></button>
      <button class="hole" type="button" aria-label="マス4"></button>
      <button class="hole" type="button" aria-label="マス5"></button>
      <button class="hole" type="button" aria-label="マス6"></button>
      <button class="hole" type="button" aria-label="マス7"></button>
      <button class="hole" type="button" aria-label="マス8"></button>
      <button class="hole" type="button" aria-label="マス9"></button>
    </section>

    <section class="character-guide" aria-label="キャラクター説明">
      <h2>キャラクター</h2>
      <div class="character-list">
        <div class="character-card">
          <img src="king.png" alt="キングモグラ">
          <span>キングモグラ</span>
          <strong>+10</strong>
        </div>
        <div class="character-card">
          <img src="ikemen.png" alt="イケメンモグラ">
          <span>イケメンモグラ</span>
          <strong>+5</strong>
        </div>
        <div class="character-card">
          <img src="kyapi.png" alt="きゃぴモグラ">
          <span>きゃぴモグラ</span>
          <strong>+3</strong>
        </div>
        <div class="character-card">
          <img src="oji.png" alt="おじモグラ">
          <span>おじモグラ</span>
          <strong>+1</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
